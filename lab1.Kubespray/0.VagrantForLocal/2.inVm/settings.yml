# sreMsa lab1 — 중첩(nested) 실습 환경 설정
#
# 바깥 VM 한 대 안에 VirtualBox·Vagrant 를 넣고, 그 안에서 vm01~vm03 을 만든다.
# 수강생에게는 이 VM 하나만 배포하면 된다.
#
# 이 파일만 고치면 된다. Vagrantfile 은 손대지 않는다.

box:
  name: "bento/ubuntu-24.04"
  version: ~
  check_update: false

boot_timeout: 900

# 바깥 VM — i1 역할(Kubespray 콘솔)과 VirtualBox 호스트를 겸한다.
#
# ⚠️ 메모리 산정이 이 방식의 최대 제약이다.
#   안쪽 노드 합계 8,704MB + 바깥 OS·VirtualBox 여유 2,048MB = 10,752MB
#   jpc1 실측: 물리 15.9GB, Windows 가 2~4GB 사용 → 10.5GB 가 상한선에 가깝다.
#   호스트가 12GB 이하면 아래 outer.memory 와 inner 노드 메모리를 함께 낮춰야 한다.
outer:
  # 2026-09-06 재조정: 안쪽이 바깥 vCPU 를 거의 다 먹어 ansible·systemd 가
  # 굶었다(load 6.12 · r=5~6 · hostnamectl dbus 타임아웃). 물리 8스레드를
  # 전부 쓰고 안쪽을 6→5 로 줄여 여유를 1→3 vCPU 로 넓힌다.
  # Windows 는 실측 CPU 1.4% 로 유휴라 8 을 줘도 굶지 않는다.
  # 2026-09-06 재조정(2차): 논리 8 은 물리 4코어의 HT 슬롯일 뿐이라
  # 실효는 코어 5개 남짓이다. 물리 코어 수와 1:1 로 맞춰 HT 경합을 없앤다.
  cpu: 4            # 물리 코어 4개와 1:1 (안쪽 3 + 여유 1)
  # 메모리 재배치 (2026-09-06 실측 근거)
  #   jpc1 물리 16,259MB · Windows 가 4,184MB 사용 → VM 가용 12,075MB
  #   구 배치 10,752MB 는 호스트 여유를 1,323MB 밖에 남기지 않아 빠듯했다.
  #   (8/30 회차에 available 569~786MB · 상시 스와핑 3시간+ 를 실측했고
  #    그 구간에 크래시가 났다.)
  #   9,728MB 로 낮춰 호스트에 2,347MB 를 남긴다.
  memory: 10240     # 안쪽 8,192 + 바깥 OS·VirtualBox 여유 2,048
  # 바깥 VM 에 붙일 host-only 주소. 안쪽 대역(192.168.56.x)과 겹치면 안 된다.
  host_ip: "192.168.57.10"
  # box 기본 디스크는 64GB 지만 LVM 이 31GB 만 잡고 있다(실측).
  # 안쪽 노드 3대가 18GB 이상 쓰므로 프로비저닝에서 전량으로 확장한다.
  expand_lvm: true

# 안쪽 노드 — 바깥 VM 안의 VirtualBox 가 만든다.
# 값의 의미는 상위 폴더 settings.yml 과 같다.
inner:
  subnet: "192.168.56"
  i1_host: 10          # 바깥 VM 이 안쪽에서 갖는 주소 = 192.168.56.10
  node_host_base: 10   # vm01 = .11, vm02 = .12, vm03 = .13
  count: 3
  cpu: 1            # 노드당 1 vCPU — 안쪽 총 3, 바깥 4 안에 들어간다
  memory: 2048      # worker 기본값
  overrides:
    vm01:
      memory: 3584  # etcd 겸임 — 가장 부하가 커 512MB 추가
    vm02:
      memory: 2560  # control-plane
  # 안쪽 합계: 3584 + 2560 + 2048 = 8,192MB / vCPU 3 (1+1+1)
  # ⚠️ kubespray 는 control-plane 에 2 vCPU 를 권장한다. 1 은 최소 미달이라
  #    컨트롤플레인 기동이 느려질 수 있으나, 물리 4코어에서 중첩 경합을
  #    없애는 쪽을 우선한 선택이다(2026-09-06 사용자 지시).

# 바깥 VM 안에 설치할 도구.
# Ubuntu 24.04 리포에 vagrant 가 없어(실측: Candidate 없음) HashiCorp 저장소를 쓴다.
tools:
  virtualbox_pkg: "virtualbox"          # noble-updates/multiverse 7.0.16
  vagrant_from: "hashicorp"             # hashicorp | deb_url
  vagrant_deb_url: ~                    # vagrant_from: deb_url 일 때 사용
