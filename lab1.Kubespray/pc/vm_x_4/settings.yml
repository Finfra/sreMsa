# sreMsa lab1 — 로컬(PC) Kubespray 실습 환경 설정
#
# 이 파일만 고치면 된다. Vagrantfile 은 손대지 않는다.
# 값을 바꾼 뒤에는 `vagrant reload --provision` 또는 `vagrant destroy -f && vagrant up`.

box:
  # Ubuntu 24.04 LTS. kubespray 2.28 이 공식 지원하는 배포판이다.
  name: "bento/ubuntu-24.04"
  # 특정 버전에 고정하려면 값을 넣는다. 비워 두면 최신을 받는다.
  # 강사가 배포한 box 를 `vagrant box add` 로 넣었다면 버전이 0 으로 잡히므로
  # 여기는 비워 두어야 한다.
  version: ~
  # vagrant up 을 할 때마다 Vagrant Cloud 에 새 버전이 있는지 물어보는 동작.
  # 교육장에서 여러 명이 동시에 실습하면 그 요청이 겹쳐 회선을 잡아먹으므로 꺼 둔다.
  # 강사가 새 box 를 받아 볼 때만 true 로 바꾼다.
  check_update: false

# 게스트가 부팅해 SSH 를 열 때까지 Vagrant 가 기다리는 시간(초).
#
# 기본값 300 초는 느린 디스크에서 모자란다. 실기(Windows 10 · 16GB · SSD)에서
# vm02 가 여기에 걸려 실패했다. VM 은 정상 부팅 중이었고 콘솔에는
# "systemd-networkd.service/start running (7min 3s)" 와
# "task blocked for more than 245 seconds" 가 찍혀 있었다.
# box 압축 해제 직후라 SSD 쓰기 캐시가 소진돼 I/O 응답이 69ms 까지 늘어난 탓이다.
#
# 기다리는 시간을 늘리는 것은 비용이 없다. 빨리 뜨면 그만큼 일찍 넘어간다.
boot_timeout: 900

network:
  # VirtualBox host-only 대역. 192.168.56.0/21 은 VirtualBox 가 기본 허용하는 범위라
  # /etc/vbox/networks.conf 를 건드릴 필요가 없다.
  subnet: "192.168.56"
  i1_host: 10          # i1   = 192.168.56.10
  node_host_base: 10   # vm01 = 192.168.56.11, vm02 = .12, vm03 = .13 ...

# 콘솔 서버 — AWS 의 i1 인스턴스와 같은 역할.
# Kubespray(Ansible)를 여기서 실행한다. Kubernetes 노드가 아니므로
# 자원을 적게 줘도 되고, swap 도 켜 둔 채로 쓴다.
i1:
  cpu: 1
  memory: 1024

nodes:
  # Kubernetes 노드 수. 3.k8sNodeManage 실습에서 4 로 올린 뒤 `vagrant up vm04`.
  count: 3
  # 아래는 기본값이고, overrides 에 적은 노드는 그 값이 이긴다.
  cpu: 2
  memory: 2560
  overrides:
    # vm01·vm02 는 kube_control_plane 이라 워커보다 더 준다.
    # (AWS inventory 와 역할 배치를 동일하게 유지하기 위함)
    vm01:
      memory: 3072
    vm02:
      memory: 3072

# 게스트 합계 기본값: 1024 + 3072 + 3072 + 2560 = 9728MB (약 9.5GB)
# vCPU 합계: 1 + 2 + 2 + 2 = 7
#   - 호스트 16GB : 가능하되 브라우저·IDE 를 닫는 편이 좋다
#   - 호스트 24GB : 권장. 노드 추가 실습(vm04, +2560MB)까지 여유롭다
#   - 호스트 12GB 이하 : README.md 의 "메모리가 부족할 때" 절 참조
#
# i1 이 1GB 인 것은 Ansible 만 돌리기 때문이다. 다만 Kubespray 가 노드마다
# fork 를 띄우는 구간에서는 빠듯할 수 있어, scripts/common.sh 가 i1 에만
# swap 파일 2GB 를 만들어 준다. i1 은 Kubernetes 노드가 아니므로
# swap 을 꺼야 할 이유가 없다.
